<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гараж">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark light">
<title>Гараж</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#070b14;--bg2:#0d1526;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09);--tx:#eef2f8;--tx2:#9aa6bb;--tx3:#667189;
  --blue:#3d7bff;--blue2:#1e4fd8;--amber:#F59E0B;--red:#EF4444;--green:#22C55E;
  --sh:0 10px 40px rgba(0,0,0,.45);--r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
html[data-theme=light]{
  --bg:#eef1f6;--bg2:#ffffff;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);
  --line:rgba(15,25,50,.08);--tx:#0e1626;--tx2:#55607a;--tx3:#8a93a8;--sh:0 8px 30px rgba(20,35,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(61,123,255,.22),transparent 60%),
  radial-gradient(700px 420px at -10% 110%,rgba(245,165,36,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;min-width:0;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tabh, calc(env(safe-area-inset-bottom) + 170px)) + 16px);max-width:1180px;margin:0 auto;width:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 18px}
h1{font-size:32px;font-weight:750;letter-spacing:-.6px;margin:0}
.sub{color:var(--tx2);font-size:13px;margin-top:2px}
h2{font-size:13px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin:26px 4px 10px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.card{padding:16px}
.grid{display:grid;gap:12px}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* bottom nav */
nav.bottom{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;display:flex;justify-content:space-around;padding:8px 6px;border-radius:26px}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--tx3);text-decoration:none;padding:4px 8px;border-radius:14px;transition:color .2s,background .2s;cursor:pointer}
nav a.on{color:var(--amber)}
/* events */
.ev{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{flex:1;min-width:0}.ev .t b{display:block;font-weight:600;font-size:15px}.ev .t span{color:var(--tx2);font-size:12.5px}
.sync{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tx2)}
.sync .dt{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.sync.busy .dt{background:var(--blue);box-shadow:0 0 10px var(--blue);animation:pl 1.4s infinite}
.sync.dirty{color:var(--amber);border-color:rgba(245,165,36,.4)}.sync.dirty .dt{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pl 1.4s infinite}
header.top>div:first-child{min-width:0;flex:1 1 auto}
header.top h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .hbtns{display:flex;gap:8px;align-items:center;flex:0 0 auto}
main{padding-left:calc(env(safe-area-inset-left) + 16px);padding-right:calc(env(safe-area-inset-right) + 16px)}
@media(max-width:440px){header.top{flex-wrap:nowrap;gap:6px;margin:0 0 12px}header.top h1{font-size:22px}header.top .sub{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header.top .hbtns{gap:6px}header.top .iconbtn{width:34px;height:34px;border-radius:11px}header.top .iconbtn svg.i{width:18px;height:18px}header.top .sync{padding:6px 8px;font-size:11px;gap:5px}header.top .iconbtn{width:32px;height:32px}}
@media(max-width:360px){header.top .hbtns{gap:4px}header.top .iconbtn{width:30px;height:30px}header.top h1{font-size:19px}}
@keyframes pl{50%{opacity:.35}}
.dd{position:fixed;z-index:52;width:300px;max-width:calc(100vw - 16px);background:#151B2B;border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:6px 14px;display:none}.dd.on{display:block}
html[data-theme=light] .dd{background:#fff}
.ov.dim{background:rgba(0,0,0,.4)}
.sync.stale{color:var(--amber);border-color:rgba(245,165,36,.55);background:rgba(245,165,36,.12)}.sync.stale .dt{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.sync.bad{color:var(--red);border-color:rgba(255,93,93,.6);background:rgba(255,93,93,.13)}.sync.bad .dt{background:var(--red);box-shadow:0 0 10px var(--red);animation:pl 1.4s infinite}
.cphw{position:relative;margin:-16px -16px 14px;aspect-ratio:16/9;overflow:hidden;border-bottom:3px solid var(--cc,var(--line))}.cph{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 55%;background:var(--glass2);transform:scale(1.18);transform-origin:50% 60%}.cph.def,.cph.wide{transform:none}.cphw .plate{position:absolute;left:12px;bottom:12px;margin:0;background:rgba(7,11,20,.72);color:#fff;border-color:rgba(255,255,255,.25);backdrop-filter:blur(6px)}
.cph.def{object-fit:contain;padding:18px}

details.more summary{list-style:none;cursor:pointer;padding:13px 16px;color:var(--blue);font-weight:600;font-size:14px;border-top:1px solid var(--line)}
details.more summary::-webkit-details-marker{display:none}details.more[open] summary .sh{display:none}details.more:not([open]) summary .hd{display:none}
.bch{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin-top:12px}
.bch .bars{display:flex;flex-direction:column;gap:3px}.bch .bars i{display:block;height:7px;border-radius:5px;min-width:2px}
.bch .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.bch .r small{display:block;color:var(--tx2);font-size:11.5px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:10px}.lg i{display:inline-block;width:10px;height:7px;border-radius:3px;margin-right:5px;vertical-align:middle}
.setl a{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}.setl a:last-child{border-bottom:0}.setl small{display:block;color:var(--tx2);font-weight:500;font-size:12px}
@supports(-webkit-touch-callout:none){body{background-attachment:scroll}}
.steps{margin:0 0 14px;padding-left:20px;color:var(--tx2);line-height:1.5}.steps b{color:var(--tx)}
.badge{font-weight:700;font-size:13px;padding:6px 10px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-red{color:var(--red)}.s-amb{color:var(--amber)}.s-grn{color:var(--green)}
.b-red{background:rgba(239,68,68,.16);color:var(--red)}.b-amb{background:rgba(245,165,36,.15);color:var(--amber)}.b-grn{background:rgba(52,199,123,.13);color:var(--green)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor;background:currentColor}
/* car card */
.car{position:relative;overflow:hidden;cursor:pointer;transition:transform .25s}
.car:active{transform:scale(.985)}
.car::after{display:none;content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(61,123,255,.25),transparent 70%);pointer-events:none}
.car .nm{font-size:20px;font-weight:700;letter-spacing:-.3px}
.plate{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--glass2);letter-spacing:.5px}
.rings{display:flex;gap:18px;margin-top:16px;align-items:center}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.ring .bgc{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-size:17px;font-variant-numeric:tabular-nums}.ring .lbl small{display:block;font-size:10px;color:var(--tx2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--tx2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.big{font-size:30px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* buttons */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.actions{grid-template-columns:repeat(4,1fr)}}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:18px;transition:transform .2s}
.act:active{transform:scale(.96)}
.act .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.35)}
.act.am .ic{background:linear-gradient(145deg,#ffbd45,#e08a00);box-shadow:0 6px 18px rgba(245,165,36,.35)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.3)}
.btn.sec{background:var(--glass2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
@media(max-width:400px){.chips{gap:4px}.chip{padding:7px 7px!important;font-size:12px!important;letter-spacing:-.1px}}.chips.fit{flex-wrap:wrap;overflow-x:visible}.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s}
.chip.on{background:var(--amber);color:#1a1100;border-color:transparent}
/* TO plan */
details.svc{margin-bottom:12px;overflow:hidden}
details.svc summary{list-style:none;cursor:pointer;padding:16px;display:flex;align-items:center;gap:12px}
details.svc summary::-webkit-details-marker{display:none}
.svc .km{font-size:19px;font-weight:700}.svc .chev{transition:transform .3s;color:var(--tx3)}
details[open]>summary .chev{transform:rotate(90deg)}
.work{padding:12px 16px;border-top:1px solid var(--line)}
.work .wh{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.work .wh span{color:var(--tx2);font-weight:500;white-space:nowrap;font-size:13px}
.part{margin:8px 0 0 10px;padding:9px 12px;border-radius:14px;background:var(--glass2);font-size:13px}
.part b{font-weight:600}.part .m{color:var(--tx2);margin-top:3px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.part .m em{font-style:normal;color:var(--tx3)}
.toh{display:flex;gap:14px;align-items:center}.toh .ring{width:72px;height:72px}.toh .ring svg{width:72px;height:72px}.toh .ring .lbl b{font-size:17px}.toh .ring .lbl small{font-size:11px}
.toh .clr{display:flex;align-items:flex-start;gap:8px;margin-top:6px}.toh .clr i{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25);margin-top:3px}.toh .clr b{display:block;font-size:15px;font-weight:500;line-height:1.3}.toh .clr small{display:block;color:var(--tx2);font-size:12px;margin-top:1px}.toh .tt{font-size:20px;font-weight:600;line-height:1.2}.toh .ts{color:var(--tx2);font-size:13px;margin-top:3px;line-height:1.35}
.kvr{margin:10px 0 0}.kvr .kr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;border-top:1px solid var(--line)}.kvr .kr span{color:var(--tx2);font-size:13px;flex:none}.kvr .kr b{font-size:15px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
details.more.tom{margin:4px -16px -16px}details.more.tom .mb2{padding:0 16px 14px}.tom h4{margin:12px 0 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.tom .kr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--line);font-size:14px}.tom .kr:last-child{border-bottom:0}.tom .kr b{font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tom ul.bl{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.4}.tom ul.bl li{margin:4px 0}.tom ul.bl li::marker{color:var(--tx3)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.srcs a,.srcs span{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--tx2);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc .km{font-size:20px;font-weight:600}.svc .sl{color:var(--tx2);font-size:13px;margin-top:4px;line-height:1.35}.svc .fcp{display:inline-flex;margin-top:6px;padding:3px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx2);margin-right:6px}
details.svc>summary.sg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:12px;row-gap:0}.sg .sl,.sg .fcw{grid-column:1/-1}.sg .sl.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg .fcw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sg .fcw .fcp{margin:0;white-space:nowrap}.svc .stot{text-align:right;white-space:nowrap}.svc .stot b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.svc .stot small{display:block;font-size:13px;color:var(--tx2);margin-top:2px}
details.wk{border-top:1px solid var(--line)}details.wk>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:44px;box-sizing:border-box}details.wk>summary::-webkit-details-marker{display:none}
.wk .wn{flex:1;min-width:0;font-size:15px;font-weight:500;line-height:1.3}.wk .wp{white-space:nowrap;color:var(--tx2);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.wk .chev,.pt .chev{display:flex;color:var(--tx3);transition:transform .2s}.wk .chev svg,.pt .chev svg{width:16px;height:16px}
.wk .wb{padding:0 16px 12px}details.pt{margin:8px 0 0;border-radius:14px;background:var(--glass2)}details.pt>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px}details.pt>summary::-webkit-details-marker{display:none}
.pt .pn{flex:1;min-width:0}.pt .pn b{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:500;line-height:1.3;word-break:break-word}.pt .pn small{display:block;color:var(--tx2);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.pt .m{color:var(--tx2);padding:0 12px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}.pt .m em{font-style:normal;color:var(--tx3)}.pt .m code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;color:var(--tx);word-break:break-all}
.tot{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.tot .h{color:var(--tx3);font-size:12px}.tot .sum{font-weight:750;font-size:16px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:rgba(245,165,36,.15);color:var(--amber);font-weight:600;margin-left:6px}
.cimg{width:76px;height:76px;border-radius:50%;flex:none;object-fit:cover;margin:-4px 0 0 -4px;box-shadow:0 6px 18px rgba(0,0,0,.25);border:2px solid var(--line);background:var(--glass)}
.card:not(.car) .cimg{width:112px;height:112px}
@media(max-width:360px){.cimg{width:60px;height:60px}.card:not(.car) .cimg{width:88px;height:88px}}
.car .rings{flex-wrap:wrap}.car .rings .kv{flex:1 1 100%!important;min-width:0}.rings .kv{min-width:118px}.rings .kv dd{white-space:nowrap}
@media(max-width:440px){.rings{flex-wrap:wrap}}
.fc{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--glass2,rgba(127,127,127,.08));border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 12px}
.fc .fl{color:var(--tx3);font-size:11.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;grid-row:span 3}
.fc b{font-size:20px;font-weight:750;letter-spacing:-.3px}.fc small{grid-column:2;color:var(--tx2);font-size:12.5px}
.tag.chk{background:rgba(245,165,36,.18);color:var(--amber)}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.phs .th{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--glass) center/cover no-repeat;cursor:pointer;display:grid;place-items:center;color:var(--tx3);font-size:10px;position:relative}
.phs .th.q::after{content:'';position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.phs .add{border-style:dashed}
.viewer img{width:100%;border-radius:16px;display:block}
.tag.new{background:rgba(61,123,255,.18);color:var(--blue)}

function forecast(c, mil, svc, cur, next, lastKm) {
