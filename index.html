<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гараж">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark light">
<title>Гараж</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#070b14;--bg2:#0d1526;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09);--tx:#eef2f8;--tx2:#9aa6bb;--tx3:#667189;
  --blue:#3d7bff;--blue2:#1e4fd8;--amber:#f5a524;--red:#ff5d5d;--green:#34c77b;
  --sh:0 10px 40px rgba(0,0,0,.45);--r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
html[data-theme=light]{
  --bg:#eef1f6;--bg2:#ffffff;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.9);
  --line:rgba(15,25,50,.08);--tx:#0e1626;--tx2:#55607a;--tx3:#8a93a8;--sh:0 8px 30px rgba(20,35,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 85% -10%,rgba(61,123,255,.22),transparent 60%),
  radial-gradient(700px 420px at -10% 110%,rgba(245,165,36,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;min-width:0;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:1180px;margin:0 auto;width:100%}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 18px}
h1{font-size:32px;font-weight:750;letter-spacing:-.6px;margin:0}
.sub{color:var(--tx2);font-size:13px;margin-top:2px}
h2{font-size:13px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);margin:26px 4px 10px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%)}
.card{padding:16px}
.grid{display:grid;gap:12px}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* bottom nav */
nav.bottom{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:20;display:flex;justify-content:space-around;padding:8px 6px;border-radius:26px}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--tx3);text-decoration:none;padding:4px 8px;border-radius:14px;transition:color .2s,background .2s;cursor:pointer}
nav a.on{color:var(--amber)}
/* events */
.ev{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .t{flex:1;min-width:0}.ev .t b{display:block;font-weight:600;font-size:15px}.ev .t span{color:var(--tx2);font-size:12.5px}
.sync{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--tx2)}
.sync .dt{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.sync.busy .dt{background:var(--blue);box-shadow:0 0 10px var(--blue);animation:pl 1.4s infinite}
.sync.dirty{color:var(--amber);border-color:rgba(245,165,36,.4)}.sync.dirty .dt{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pl 1.4s infinite}
header.top>div:first-child{min-width:0;flex:1 1 auto}
header.top h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .hbtns{display:flex;gap:8px;align-items:center;flex:0 0 auto}
main{padding-left:calc(env(safe-area-inset-left) + 16px);padding-right:calc(env(safe-area-inset-right) + 16px)}
@media(max-width:440px){header.top{flex-wrap:wrap;gap:8px}header.top h1{font-size:26px}header.top .hbtns{gap:6px}header.top .iconbtn{width:34px;height:34px;border-radius:11px}header.top .iconbtn svg.i{width:18px;height:18px}header.top .sync{padding:6px 9px;font-size:11.5px}}
@media(max-width:360px){header.top .hbtns{width:100%;justify-content:flex-end}header.top .iconbtn{width:32px;height:32px}}
@keyframes pl{50%{opacity:.35}}
@supports(-webkit-touch-callout:none){body{background-attachment:scroll}}
.steps{margin:0 0 14px;padding-left:20px;color:var(--tx2);line-height:1.5}.steps b{color:var(--tx)}
.badge{font-weight:700;font-size:13px;padding:6px 10px;border-radius:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.s-red{color:var(--red)}.s-amb{color:var(--amber)}.s-grn{color:var(--green)}
.b-red{background:rgba(255,93,93,.14);color:var(--red)}.b-amb{background:rgba(245,165,36,.15);color:var(--amber)}.b-grn{background:rgba(52,199,123,.13);color:var(--green)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor;background:currentColor}
/* car card */
.car{position:relative;overflow:hidden;cursor:pointer;transition:transform .25s}
.car:active{transform:scale(.985)}
.car::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(61,123,255,.25),transparent 70%);pointer-events:none}
.car .nm{font-size:20px;font-weight:700;letter-spacing:-.3px}
.plate{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;font-weight:600;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--glass2);letter-spacing:.5px}
.rings{display:flex;gap:18px;margin-top:16px;align-items:center}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.ring .bgc{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring .lbl b{font-size:17px;font-variant-numeric:tabular-nums}.ring .lbl small{display:block;font-size:10px;color:var(--tx2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--tx2)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.big{font-size:30px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* buttons */
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.actions{grid-template-columns:repeat(4,1fr)}}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:18px;transition:transform .2s}
.act:active{transform:scale(.96)}
.act .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.35)}
.act.am .ic{background:linear-gradient(145deg,#ffbd45,#e08a00);box-shadow:0 6px 18px rgba(245,165,36,.35)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:650;cursor:pointer;background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 18px rgba(61,123,255,.3)}
.btn.sec{background:var(--glass2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s}
.chip.on{background:var(--amber);color:#1a1100;border-color:transparent}
/* TO plan */
details.svc{margin-bottom:12px;overflow:hidden}
details.svc summary{list-style:none;cursor:pointer;padding:16px;display:flex;align-items:center;gap:12px}
details.svc summary::-webkit-details-marker{display:none}
.svc .km{font-size:19px;font-weight:700}.svc .chev{transition:transform .3s;color:var(--tx3)}
details[open] .chev{transform:rotate(90deg)}
.work{padding:12px 16px;border-top:1px solid var(--line)}
.work .wh{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.work .wh span{color:var(--tx2);font-weight:500;white-space:nowrap;font-size:13px}
.part{margin:8px 0 0 10px;padding:9px 12px;border-radius:14px;background:var(--glass2);font-size:13px}
.part b{font-weight:600}.part .m{color:var(--tx2);margin-top:3px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.part .m em{font-style:normal;color:var(--tx3)}
.tot{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.tot .h{color:var(--tx3);font-size:12px}.tot .sum{font-weight:750;font-size:16px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:rgba(245,165,36,.15);color:var(--amber);font-weight:600;margin-left:6px}
.cimg{width:76px;height:76px;border-radius:50%;flex:none;object-fit:cover;margin:-4px 0 0 -4px;box-shadow:0 6px 18px rgba(0,0,0,.25);border:2px solid var(--line);background:var(--glass)}
.card:not(.car) .cimg{width:112px;height:112px}
@media(max-width:360px){.cimg{width:60px;height:60px}.card:not(.car) .cimg{width:88px;height:88px}}
.rings .kv{min-width:118px}.rings .kv dd{white-space:nowrap}
@media(max-width:440px){.rings{flex-wrap:wrap}}
.fc{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--glass2,rgba(127,127,127,.08));border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:2px 12px}
.fc .fl{color:var(--tx3);font-size:11.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;grid-row:span 3}
.fc b{font-size:20px;font-weight:750;letter-spacing:-.3px}.fc small{grid-column:2;color:var(--tx2);font-size:12.5px}
.tag.chk{background:rgba(245,165,36,.18);color:var(--amber)}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.phs .th{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--glass) center/cover no-repeat;cursor:pointer;display:grid;place-items:center;color:var(--tx3);font-size:10px;position:relative}
.phs .th.q::after{content:'';position:absolute;right:4px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.phs .add{border-style:dashed}
.viewer img{width:100%;border-radius:16px;display:block}
.tag.new{background:rgba(61,123,255,.18);color:var(--blue)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}.row .l{min-width:0}.row .l small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.row .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--tx2);font-size:13px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);cursor:pointer;font-weight:600;margin-bottom:8px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:520px;margin:0 auto;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);border-radius:28px 28px 0 0;background:var(--bg2);border:1px solid var(--line);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1);max-height:90vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:20px}
label.f{display:block;margin-bottom:12px;font-size:12.5px;color:var(--tx2);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);font-size:16px;outline:none}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--blue)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);z-index:60;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;transition:transform .4s cubic-bezier(.2,.9,.2,1)}
.toast.on{transform:translate(-50%,0)}
/* desktop */
@media (min-width:900px){
  nav.bottom{display:none}
  nav.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;width:240px;padding:28px 14px;border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
  nav.side .logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:20px;padding:0 10px 22px}
  nav.side .logo img{width:34px;height:34px;border-radius:10px}
  nav.side a{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;color:var(--tx2)}
  nav.side a.on{background:var(--glass2);color:var(--tx)}nav.side a.on svg{color:var(--amber)}
  main{padding:30px 36px 40px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{bottom:auto;top:50%;border-radius:28px;transform:translateY(-40%) scale(.96);opacity:0;pointer-events:none;transition:all .3s}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<nav class="bottom glass" id="bottom"></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast glass" id="toast"></div>
<input type="file" id="imp" accept=".json,application/json,text/plain" hidden>
<script>
"use strict";
/* Общее надёжное хранилище для приложений на makc178.github.io (одно происхождение => общий localStorage с лимитом ~5 МБ).
   Ключи с префиксом приложения; дубль в IndexedDB; navigator.storage.persist(). Ничего не удаляет само. */
const VAULT = (() => { const DB = 'makc178-vault', ST = 'kv';
  const db = () => new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('no idb')); const o = indexedDB.open(DB, 1);
    o.onupgradeneeded = () => o.result.createObjectStore(ST); o.onsuccess = () => res(o.result); o.onerror = () => rej(o.error); });
  const get = async k => { const d = await db(); return new Promise((res, rej) => { const r = d.transaction(ST).objectStore(ST).get(k); r.onsuccess = () => res(r.result ?? null); r.onerror = () => rej(r.error); }); };
  const put = async (k, v) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(ST, 'readwrite'); v == null ? t.objectStore(ST).delete(k) : t.objectStore(ST).put(v, k); t.oncomplete = () => res(true); t.onerror = () => rej(t.error); }); };
  const persist = () => { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} };
  return {get: k => get(k).catch(() => null), set: (k, v) => put(k, v).catch(() => false), persist}; })();
let DATA = /*__DATA__*/null;
/* режим «свой гараж»: репозиторий не makc178/garage-data -> база JSON только в репозитории пользователя, без бота */
const OWNER_REPO = 'makc178/garage-data';
const OWN = (() => { try { const o = JSON.parse(localStorage.getItem('garage.gh.v1')); return !!(o && o.repo && o.repo.toLowerCase() !== OWNER_REPO); } catch (e) { return false; } })();
const emptyDB = () => ({cars: [], mileage: [], service: [], budget: [], insurance: [], plans: {}, rates: [], applied: [], built: ''});
const LSN = OWN ? 'garage.own.snapshot.v1' : 'garage.snapshot.v1';
const DEFCAR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath></defs><g clip-path="url(#c)"><rect width="200" height="200" fill="#e4e8ee"/><g fill="none" stroke="#c3cad5" stroke-width="2"><path d="M-10 40q60-25 110 0t120-5"/><path d="M-10 70q55-20 105 5t115-10"/><path d="M-10 160q60 20 110-5t120 10"/><path d="M-10 185q55 15 110-8t120 8"/></g><path d="M28 128h144v-14l-10-6-26-6-20-18H70l-20 20-16 4-6 6z" fill="#5d6b80"/><path d="M78 88h38l16 16H64z" fill="#aeb9c9"/><circle cx="62" cy="130" r="15" fill="#2c3442"/><circle cx="62" cy="130" r="6" fill="#aeb9c9"/><circle cx="140" cy="130" r="15" fill="#2c3442"/><circle cx="140" cy="130" r="6" fill="#aeb9c9"/></g></svg>');
const CARIMG = {"ford-bronco": "cars/ford-bronco.webp", "land-rover-defender": "cars/land-rover-defender.webp", "range-rover-sport": "cars/range-rover-sport.webp"};
const carImg = n => CARIMG[{'Land Rover Defender': 'land-rover-defender', 'Range Rover Sport': 'range-rover-sport', 'Ford Bronco': 'ford-bronco'}[n] || String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-')];
if (OWN) DATA = null;
if (!DATA) { try { DATA = JSON.parse(localStorage.getItem(LSN)); } catch (e) {} }
if (OWN && !(DATA && DATA.cars)) DATA = emptyDB();
const LS = OWN ? 'garage.own.changes.v1' : 'garage.changes.v1', LT = 'garage.theme';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null || n === '' || isNaN(n) ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ');
const rub = n => n == null || n === '' ? '—' : fmt(n) + ' ₽';
const km = n => n == null ? '—' : fmt(n) + ' км';
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const pd = s => { if (!s) return null; let m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return new Date(+m[1], m[2]-1, +m[3]);
  if ((m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s))) return new Date(+m[3], m[2]-1, +m[1]);
  if ((m = /^(\d{2})\.(\d{4})$/.exec(s))) return new Date(+m[2], m[1]-1, 1); return null; };
const fd = d => d ? d.toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'}) : 'дата не указана';
const days = d => Math.round((d - today()) / 864e5);
const plural = (n, a, b, c) => { const x = Math.abs(n) % 100, y = x % 10; return x > 10 && x < 20 ? c : y === 1 ? a : y > 1 && y < 5 ? b : c; };
const dlabel = n => n < 0 ? 'просрочено' : n === 0 ? 'сегодня' : n + ' ' + plural(n, 'день', 'дня', 'дней');
const stD = n => n <= 30 ? 'red' : n <= 90 ? 'amb' : 'grn';
const stK = n => n <= 1000 ? 'red' : n <= 3000 ? 'amb' : 'grn';
const COL = {red:'var(--red)', amb:'var(--amber)', grn:'var(--green)'};
const short = n => ({'Land Rover Defender':'Defender','Range Rover Sport':'Range Rover Sport','Ford Bronco':'Bronco'}[n] || n);

const I = {

  const done = new Set((DATA.applied || [])); ['mileage', 'service', 'budget'].forEach(k => CH[k] = CH[k].filter(x => !done.has(x.id)));
  save(); return add;
}
async function openCloud() {
  if (FSA) { try { const [h] = await showOpenFilePicker({types: [{description: 'Данные Гаража', accept: {'application/json': ['.json']}}], multiple: false});
      const add = mergeFile(JSON.parse(await (await h.getFile()).text())); FH = h; fhSet(h);
      SY.last = new Date().toISOString(); SY.file = h.name; saveSY(); render(); toast(`Открыто: +${add} записей. Файл запомнен`); return;
    } catch (e) { if (e.name === 'AbortError') return; if (!(e instanceof TypeError || e.name === 'SecurityError')) return toast('Ошибка: ' + e.message); } }
  $('#imp').click();
}
function importJSON(file) {
  const r = new FileReader(); r.onload = () => { try { const add = mergeFile(JSON.parse(r.result));
    SY.last = new Date().toISOString(); SY.file = file.name; saveSY(); render(); toast(`Загружено: +${add} записей`); } catch (e) { toast('Ошибка: ' + e.message); } }; r.readAsText(file);
}
async function saveCloud() {
  const text = JSON.stringify(payload(), null, 1);
  const done = how => { SY.dirty = false; SY.last = new Date().toISOString(); saveSY(); render(); toast(how); };
  if (FH && FH.createWritable) { try {
      if (FH.queryPermission && (await FH.queryPermission({mode: 'readwrite'})) !== 'granted' && (await FH.requestPermission({mode: 'readwrite'})) !== 'granted') throw new Error('нет доступа');
      const w = await FH.createWritable(); await w.write(text); await w.close(); return done('Сохранено в ' + FH.name);
    } catch (e) { toast('Не удалось записать напрямую: ' + e.message); } }
  if (FSA && window.showSaveFilePicker) { try { const h = await showSaveFilePicker({suggestedName: FNAME, types: [{description: 'Данные Гаража', accept: {'application/json': ['.json']}}]});
      const w = await h.createWritable(); await w.write(text); await w.close(); FH = h; fhSet(h); return done('Сохранено в ' + h.name);
    } catch (e) { if (e.name === 'AbortError') return; } }
  const file = new File([text], FNAME, {type: 'application/json'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: FNAME});
      return done('Готово. Проверьте, что файл перезаписан в папке «Гараж»'); } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = FNAME; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  done('Файл скачан — замените им garage-data.json в iCloud/Гараж');
}
function help() {
  sheet(`<h3>Как синхронизировать</h3>
  <ol class="steps"><li>В iCloud Drive есть папка <b>«Гараж»</b> с файлами <b>garage.html</b> и <b>garage-data.json</b>.</li>
  <li>Начиная работу, нажмите <b>«Открыть данные из iCloud»</b> и выберите <b>garage-data.json</b> — подтянутся записи с других устройств.</li>
  <li>Внесите пробег, ТО или расход.</li>
  <li>Нажмите <b>«Сохранить в iCloud»</b>.<br>• <b>Chrome / Edge на Mac</b> — файл перезапишется сам.<br>• <b>iPhone</b> — в меню «Поделиться» выберите «Сохранить в Файлы» → iCloud Drive → Гараж → «Заменить».<br>• <b>Safari на Mac</b> — файл скачается в «Загрузки», перетащите его в папку Гараж с заменой.</li>
  <li>Чтобы записи попали в таблицу, пришлите <b>garage-data.json</b> Механику.</li></ol>
  <div class="muted" style="margin-bottom:14px">Последняя синхронизация: ${fdt(SY.last)}${SY.file ? ' · ' + esc(SY.file) : ''}${FH ? ' · прямое сохранение включено' : ''}<br>Локальных записей: ${CH.mileage.length + CH.service.length + CH.budget.length}${SY.dirty ? ' · <span class="s-amb">есть несохранённые изменения</span>' : ''}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sec" data-act="close" style="flex:1">Закрыть</button><button class="btn sec" data-act="srv" style="flex:1">Сервер</button><button class="btn sec" data-act="open" style="flex:1">Открыть</button><button class="btn" data-act="savecloud" style="flex:1">Сохранить</button></div>`);
}
function theme(next) {
  let t = lsGet(LT) || 'dark';
  if (next) { t = t === 'dark' ? 'light' : 'dark'; lsSet(LT, t); }
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#070b14' : '#eef1f6';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-open],[data-tocar],[data-ph]'); if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.open) return go('cars', {car: t.dataset.open});
  if (t.dataset.ph) { const u = phURL[t.dataset.ph]; if (u) sheet(`<div class="viewer"><img src="${u}" alt="Фото заказ-наряда"></div><div style="margin-top:12px"><button class="btn sec" data-act="close" style="width:100%">Закрыть</button></div>`); return; }
  if (t.dataset.tocar) { state.toCar = t.dataset.tocar; return render(); }
  const a = t.dataset.act;
  if (['mileage', 'service', 'expense'].includes(a)) form(a, t.dataset.car);
  else if (a === 'close') close();
  else if (a === 'export') exportJSON();
  else if (a === 'import' || a === 'open') { close(); openCloud(); }
  else if (a === 'savecloud') { close(); saveCloud(); }
  else if (a === 'help') help();
  else if (a === 'srv') srvSettings();
  else if (a === 'disc') { if (confirm('Удалить ключ GitHub с этого устройства?')) { VAULT.get('shared:token').then(t => { if (t === SRV.token) VAULT.set('shared:token', null); SRV = {repo: SRV.repo, token: ''}; lsSet(LSV, JSON.stringify(SRV)); VAULT.set('garage:gh', SRV); render(); }); close(); render(); toast('Ключ удалён'); } }
  else if (a === 'addphoto') pickPhotos({car: t.dataset.car, date: t.dataset.date || null, km: t.dataset.km === '' ? null : +t.dataset.km});
  else if (a === 'wo') woForm(t.dataset.car);
  else if (a === 'theme') theme(true);
  else if (a === 'caradd') carForm(null);
  else if (a === 'caredit') carForm(t.dataset.car);
  else if (a === 'cardel') carDel(t.dataset.car);
  else if (a === 'carphoto') pickCarPhoto();
  else if (a === 'mkrepo') mkRepo();
  else if (a === 'clear') { if (confirm('Удалить локальные изменения с этого устройства?')) { CH = {mileage: [], service: [], budget: []}; save(); markDirty(); close(); render(); } }
});
$('#ov').onclick = close;
document.addEventListener('submit', submit);
$('#imp').onchange = e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; };
theme(); render();
(async () => {   // ключ: localStorage -> IndexedDB -> общий ключ другого приложения (если у него есть доступ к репозиторию)
  if (!srvOn()) { const o = await VAULT.get('garage:gh'); if (o && o.token) { SRV = o; lsSet(LSV, JSON.stringify(SRV)); if ((SRV.repo.toLowerCase() !== OWNER_REPO) !== OWN) return location.reload(); } }
  if (OWN) { render(); srvSync(); return; }
  if (!srvOn()) { const t = await VAULT.get('shared:token'); if (t) { try { const r = await fetch(`https://api.github.com/repos/${SRV.repo}`, {headers: {Authorization: 'Bearer ' + t}});
        if (r.ok) { SRV = {repo: SRV.repo, token: t}; lsSet(LSV, JSON.stringify(SRV)); VAULT.set('garage:gh', SRV); } } catch (e) {} } }
  else VAULT.set('garage:gh', SRV);
  if (srvOn()) VAULT.persist(); render(); srvSync(); })();
</script>
